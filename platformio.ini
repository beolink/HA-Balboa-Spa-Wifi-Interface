; Balboa Spa Wifi Interface firmware.
;
;   pio run -e atoms3-lite                      build
;   pio run -e atoms3-lite -t upload            first flash over USB
;   pio run -e atoms3-lite -t upload --upload-port spa-bridge.local   later, over Wi-Fi (OTA)
;
; Pins per board: BUS_RX_PIN / BUS_TX_PIN to the RS-485 transceiver, BUS_DE_PIN
; for a transceiver that needs a driver-enable line (-1: auto direction),
; STATUS_LED_PIN for a WS2812 status LED (-1: none).

[platformio]
default_envs = atoms3-lite

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-Wall
	-DCORE_DEBUG_LEVEL=0
lib_ldf_mode = deep+

; M5Stack AtomS3 Lite (C124, ESP32-S3) on the Atomic RS485 Base (auto direction).
[env:atoms3-lite]
board = m5stack-atoms3
build_flags =
	${env.build_flags}
	-DBOARD_NAME='"M5Stack AtomS3 Lite + Atomic RS485 Base"'
	-DBUS_RX_PIN=5
	-DBUS_TX_PIN=6
	-DBUS_DE_PIN=-1
	-DSTATUS_LED_PIN=35
	-DARDUINO_USB_CDC_ON_BOOT=1

; M5Stack Atom Lite (ESP32-PICO-D4) on the Atomic RS485 Base (auto direction).
[env:atom-lite]
board = m5stack-atom
build_flags =
	${env.build_flags}
	-DBOARD_NAME='"M5Stack Atom Lite + Atomic RS485 Base"'
	-DBUS_RX_PIN=22
	-DBUS_TX_PIN=19
	-DBUS_DE_PIN=-1
	-DSTATUS_LED_PIN=27

; Any ESP32 dev board with a 3.3 V RS-485 module (e.g. MAX3485) and a buck
; converter from the bus supply. Set the pins to your wiring.
[env:esp32dev]
board = esp32dev
build_flags =
	${env.build_flags}
	-DBOARD_NAME='"ESP32 + RS-485 module"'
	-DBUS_RX_PIN=16
	-DBUS_TX_PIN=17
	-DBUS_DE_PIN=-1
	-DSTATUS_LED_PIN=-1
